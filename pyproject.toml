[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sclongcallr"
version = "0.1.0"
description = "Single-cell long-read RNA-seq variant calling, haplotype phasing, and allele-specific cancer genomics"
readme = "README.md"
authors = [{ name = "Ashwini", email = "research@example.com" }]
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "pandas>=1.3.0",
]

[project.optional-dependencies]
deeplearning = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
]
singlecell = [
    "anndata>=0.8.0",
    "scanpy>=1.9.0",
    "pysam>=0.19.0",
]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
]
all = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "anndata>=0.8.0",
    "scanpy>=1.9.0",
    "pysam>=0.19.0",
    "pytest>=7.0.0",
]

[project.scripts]
sclongcallr = "sclongcallr.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sclongcallr*"]
